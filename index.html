<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>manager panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0b0b0f;
    --sidebar:#0e0e12;
    --card:#121218;
    --border:#1c1c24;

    --text:#e6e6e6;
    --muted:#7a7a7a;

    --purple:#b76cff;
    --purple2:#6b42ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:var(--bg);
    overflow-x:hidden;
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(18px);
}

.login-box{
    width:420px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:24px;
    padding:35px;
}

.login-title{font-size:34px;font-weight:900;}
.login-sub{color:#8f8f8f;margin-bottom:24px;}
.login-error{margin-top:15px;color:#ff6a7d;display:none;}

.hidden{display:none!important;}

/* NAVBAR */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:68px;
    background:rgba(10,10,14,.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    z-index:999;
}

.brand{
    font-size:20px;
    font-weight:900;
}

.brand span{color:var(--purple);}

.right-tag{
    position:absolute;
    right:26px;
    top:22px;
    font-weight:800;
    font-size:13px;
    color:#cfcfcf;
}

/* LAYOUT */

.layout{
    display:flex;
    padding-top:68px;
}

.sidebar{
    width:250px;
    height:calc(100vh - 68px);
    background:var(--sidebar);
    position:fixed;
    border-right:1px solid var(--border);
}

.nav-item{
    padding:15px 24px;
    font-size:13px;
    font-weight:700;
    color:#8d8d8d;
    cursor:pointer;
}

.nav-item:hover{background:#15151c;color:white;}
.nav-item.active{color:white;background:#14141a;border-left:3px solid var(--purple);}

.main{
    margin-left:250px;
    width:100%;
    padding:30px;
}

/* CARD */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    margin-bottom:22px;
}

.card-title{
    color:#777;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:18px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.stat{
    background:#15151c;
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
}

.stat-value{
    font-size:28px;
    font-weight:900;
}

.stat-label{
    margin-top:8px;
    color:#777;
    font-size:12px;
}

/* BUTTONS */

.btn{
    background:#17171d;
    border:1px solid #2a2a35;
    color:#d2d2d2;
    padding:11px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.btn:hover{border-color:var(--purple);color:white;}

.btn-purple{
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    border:none;
    color:white;
}

.btn-danger{
    background:#1a0f12;
    border-color:#3a1a22;
    color:#ff8ea1;
}

/* INPUTS */

input,select,textarea{
    width:100%;
    background:#0e0e12;
    border:1px solid var(--border);
    color:white;
    padding:14px;
    border-radius:12px;
}

/* PANELS */

.panel{display:none;}
.panel.active{display:block;}

/* TABLE */

.table-wrap{
    overflow:auto;
    border:1px solid var(--border);
    border-radius:16px;
}

table{width:100%;border-collapse:collapse;}

th{
    background:#121218;
    padding:16px;
    text-align:left;
    font-size:11px;
    color:#777;
}

td{
    padding:16px;
    border-bottom:1px solid #1b1b22;
}

/* STATUS */

.status-online{color:#4be285;}
.status-offline{color:#8d8d8d;}
.status-banned{color:#ff637d;}
.status-timeout{color:#ffbf52;}
.status-kicked{color:#9d9d9d;}

</style>
</head>

<body>

<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="login-title">secure access</div>
        <div class="login-sub">enter password</div>

        <input type="password" id="passwordInput" onkeydown="if(event.key==='Enter') login()">

        <button class="btn btn-purple" style="width:100%;margin-top:18px;" onclick="login()">unlock</button>

        <div class="login-error" id="loginError">invalid password</div>
    </div>
</div>

<div class="navbar">
    <div class="brand">control<span>.core</span></div>
    <div class="right-tag">silent [Manager]</div>
</div>

<div class="layout">

<aside class="sidebar">
    <div class="nav-item active" onclick="switchPanel('dashboard',this)">Dashboard</div>
    <div class="nav-item" onclick="switchPanel('users',this)">Users</div>
    <div class="nav-item" onclick="switchPanel('userpanel',this)">User Panel</div>
    <div class="nav-item" onclick="switchPanel('logs',this)">Audit Logs</div>
</aside>

<main class="main">

<div id="dashboard" class="panel active">

    <div class="stats">
        <div class="stat"><div class="stat-value" id="totalUsers">0</div><div class="stat-label">USERS</div></div>
        <div class="stat"><div class="stat-value" id="onlineUsers">0</div><div class="stat-label">ONLINE</div></div>
        <div class="stat"><div class="stat-value">SECURE</div><div class="stat-label">STATUS</div></div>
        <div class="stat"><div class="stat-value">NODE</div><div class="stat-label">SYSTEM</div></div>
    </div>

</div>

<div id="users" class="panel">

    <div class="card">
        <input id="searchInput" oninput="renderUsers()" placeholder="Search users...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Rank</th><th>Status</th><th>Joined</th></tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>

</div>

<div id="userpanel" class="panel">
    <div class="card">
        <input id="targetUser" placeholder="username...">

        <select id="rankSelect">
            <option>MEMBER</option>
            <option>VIP</option>
            <option>CRIMINAL</option>
            <option>RICH</option>
            <option>COUNCIL</option>
            <option>MOD</option>
            <option>MANAGER</option>
            <option>ADMIN</option>
            <option>FOUNDER</option>
        </select>

        <button class="btn btn-purple" onclick="changeRank()">Change Rank</button>
        <button class="btn btn-danger" onclick="deleteUser()">Delete</button>

        <div id="panelStatus"></div>
    </div>
</div>

<div id="logs" class="panel">
    <div id="logsBox"></div>
</div>

</main>

</div>

<script>

function login(){
    const pass = document.getElementById("passwordInput").value;
    if(pass === "1344"){
        document.getElementById("loginScreen").classList.add("hidden");
    } else {
        document.getElementById("loginError").style.display="block";
    }
}

const users=[];
const ranks=["MEMBER","VIP","CRIMINAL","RICH","COUNCIL","MOD","MANAGER","ADMIN","FOUNDER"];

for(let i=0;i<80;i++){
users.push({
id:Math.floor(Math.random()*99999),
name:"user"+i,
rank:"MEMBER",
status:Math.random()>0.5?"Online":"Offline",
joined:"2025"
});
}

function renderUsers(){
const t=document.getElementById("userTable");
t.innerHTML=users.map(u=>`
<tr>
<td>${u.id}</td>
<td>${u.name}</td>
<td>${u.rank}</td>
<td>${u.status}</td>
<td>${u.joined}</td>
</tr>`).join("");
document.getElementById("totalUsers").innerText=users.length;
document.getElementById("onlineUsers").innerText=users.filter(u=>u.status==="Online").length;
}

renderUsers();

function switchPanel(id,el){
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
document.getElementById(id).classList.add("active");
el.classList.add("active");
}

function getUser(){
const n=document.getElementById("targetUser").value.toLowerCase();
return users.find(u=>u.name.toLowerCase()===n);
}

function changeRank(){
const u=getUser();
if(!u)return;
u.rank=document.getElementById("rankSelect").value;
renderUsers();
}

function deleteUser(){
const u=getUser();
if(!u)return;
users.splice(users.indexOf(u),1);
renderUsers();
}

</script>

</body>
</html>
