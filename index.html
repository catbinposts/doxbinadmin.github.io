<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Manager</title>
    <style>
        :root {
            --bg-main: #080808;
            --bg-sidebar: #030303;
            --bg-card: #0d0d0d;
            --border: #1a1a1a;
            --accent: #bb71e4;
            --text: #a0a0a0;
            --danger: #ff4444;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
        }

        .navbar {
            height: 50px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: fixed;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
        }

        .brand { color: #fff; font-weight: 800; letter-spacing: 1px; font-size: 14px; }
        .brand span { color: var(--accent); }

        .layout { display: flex; padding-top: 50px; }

        .sidebar {
            width: 220px;
            height: calc(100vh - 50px);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            padding-top: 20px;
        }

        .nav-item {
            padding: 12px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover { background: #0a0a0a; color: #fff; }
        .nav-item.active { 
            background: #0f0f0f; 
            color: #fff; 
            border-left-color: var(--accent);
        }

        .main { margin-left: 220px; padding: 30px; width: 100%; }

        /* Dashboard Components */
        .purge-container {
            max-width: 600px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 4px;
        }

        input[type="text"] {
            width: 100%;
            background: #050505;
            border: 1px solid var(--border);
            padding: 12px;
            color: #fff;
            margin: 10px 0;
            box-sizing: border-box;
            outline: none;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: 0.3s;
        }

        .btn-purge { background: var(--danger); color: white; width: 100%; margin-top: 10px; }
        .btn-purge:hover { opacity: 0.8; box-shadow: 0 0 15px rgba(255, 68, 68, 0.3); }
        
        .btn-table { padding: 4px 8px; margin-right: 4px; background: #1a1a1a; color: #888; border: 1px solid #333; }
        .btn-table:hover { color: #fff; border-color: var(--accent); }
        .btn-ban { color: var(--danger); }

        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); }
        th { text-align: left; padding: 12px 15px; color: #444; border-bottom: 1px solid var(--border); font-size: 10px; }
        td { padding: 10px 15px; border-bottom: 1px solid #111; }

        .role { font-weight: bold; font-size: 10px; }
        .role-manager { color: var(--accent); }
        .role-rich { color: #00ffcc; }
        .role-mod { color: #00d4ff; }
        .role-admin { color: #ff4444; }

        .hidden { display: none; }
        .status-msg { margin-top: 15px; font-style: italic; color: var(--accent); display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">SILENT <span>[MANAGER]</span></div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="nav-item active" onclick="tab('users')">👥 Users</div>
            <div class="nav-item" onclick="tab('purge')">🔥 Purge Paste</div>
            <div class="nav-item" onclick="tab('logs')">📜 Audit Logs</div>
        </aside>

        <main class="main">
            <!-- USERS SECTION -->
            <div id="users-sec">
                <table id="userTableMain">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Rank</th>
                            <th>Management</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>

            <!-- PURGE SECTION -->
            <div id="purge-sec" class="hidden">
                <div class="purge-container">
                    <h2 style="color:#fff; margin-top:0">Instant Purge</h2>
                    <p>Enter the paste URL or ID to remove it permanently from the database.</p>
                    <input type="text" id="purgeInput" placeholder="https://doxbin.net/upload/xxxx...">
                    <button class="btn btn-purge" onclick="executePurge()">Execute Purge</button>
                    <div id="purgeStatus" class="status-msg">Request sent to database clusters...</div>
                </div>
            </div>

            <!-- LOGS SECTION -->
            <div id="logs-sec" class="hidden">
                <table>
                    <thead>
                        <tr>
                            <th>Operator</th>
                            <th>Action</th>
                            <th>Context</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const admins = ["ceo", "Admin", "Kaede", "month", "boss"];
        const list = ["asuna", "Bella", "go5", "her", "sewer", "ace", "mishka", "Hacker", "ye", "vxu", "xan", "king", "Kris", "Akanori", "baki", "laskun", "engineowning", "vayne", "paranoid", "law", "obsessor", "config", "Joey", "Worsaken", "ruin", "Ry", "Fed", "babytron", "tragic", "rockstar", "glow", "Ty", "proxy", "Kira", "bladee", "declare", "Leonardo", "sean", "ghoul", "lord", "kills", "Ivan", "femboy", "solar", "Dolphin", "Harmless", "Graveyard", "Vile", "horrid", "meow", "lyoni", "dw", "coffin", "Machiavelli", "Drayco", "Jay", "stalker", "doppler", "Icmp", "Water", "Rogue", "sick", "ave", "sin", "wdr", "DGSI", "mature", "father", "Kaito", "shorty", "Network", "Amulet", "Valor", "irc", "Cliqued", "Designer", "Konti", "crown", "compa", "zui", "cult", "cell", "viceatone", "Icarus", "bane", "cure", "Unknown", "Imran", "Lota", "Unholy", "drayn", "dinner", "sixset", "extort", "Eevee", "dritan", "kitty", "cherry", "crook", "skydive", "fiji", "xf24", "pastin", "vela", "xpath", "shawty", "Wilson", "Crew", "livid", "Ringwraith", "archive", "emma", "r00tkit", "injured", "fbh", "LOVEBRO", "eth", "candle", "agentone", "Larceny", "pvtswat", "Nocif", "Clairvoyant", "Ichigo", "juvenile", "ninja", "evelyn", "graceful", "Haine", "Priority", "templates", "prince", "Stitch", "strawb", "gia", "Rapture", "starboy", "ruhydon", "DexCFW", "Disturbia", "deathnotes", "Fusi", "ib", "Fire", "shokoloko", "Weather", "adderall", "lucki", "Christian", "Niridya", "distress", "tea", "wink", "lethal", "remi", "twink", "BestBuy", "Amoere", "Padlock", "dyssomnia", "Harm", "alex", "nanachi", "Pusha", "convict", "johnnyzyns", "Arcturus", "Swattin", "asset", "mop", "harmed", "vampire", "Terminator", "zoeycat", "John", "Demon", "Clique", "Valhalla", "goth", "scare", "Italy", "pumpkin", "merc"];

        // Render Users
        const uTable = document.getElementById('userTable');
        uTable.innerHTML = list.map((name, i) => `
            <tr id="row-${i}">
                <td>#${1000 + i}</td>
                <td style="color:#eee; font-weight:600">${name}</td>
                <td><span id="rank-${i}" class="role role-rich">Rich</span></td>
                <td>
                    <button class="btn btn-table" onclick="setRank(${i}, 'Mod')">Rank+</button>
                    <button class="btn btn-table" onclick="setRank(${i}, 'Rich')">Rank-</button>
                    <button class="btn btn-table btn-ban" onclick="banUser(${i})">Ban</button>
                </td>
            </tr>
        `).join('');

        // Action Functions
        function setRank(id, rank) {
            const el = document.getElementById(`rank-${id}`);
            el.className = `role role-${rank.toLowerCase()}`;
            el.innerText = rank;
        }

        function banUser(id) {
            if(confirm("Confirm permanent ban?")) {
                document.getElementById(`row-${id}`).style.opacity = "0.3";
                document.getElementById(`row-${id}`).style.pointerEvents = "none";
            }
        }

        function executePurge() {
            const input = document.getElementById('purgeInput');
            const status = document.getElementById('purgeStatus');
            if(!input.value) return;
            
            status.style.display = "block";
            status.innerText = "Connecting to DB...";
            
            setTimeout(() => {
                status.innerText = "Wiping data segments...";
                setTimeout(() => {
                    status.innerText = "SUCCESS: Paste data purged.";
                    input.value = "";
                }, 1500);
            }, 1000);
        }

        // Diversified Logs
        const lTable = document.getElementById('logTable');
        const actions = ["PURGE_EXEC", "BAN_USER", "RANK_CHANGE", "LOGIN_SUCCESS", "SQL_QUERY"];
        let logHtml = "";
        for(let i=0; i<200; i++) {
            const adm = admins[Math.floor(Math.random() * admins.length)];
            const act = actions[Math.floor(Math.random() * actions.length)];
            logHtml += `
                <tr>
                    <td style="color:var(--accent)">${adm}</td>
                    <td><span style="background:#111; padding:2px 5px; border-radius:3px; font-size:9px;">${act}</span></td>
                    <td>Session #${Math.floor(Math.random()*99999)}</td>
                    <td style="color:#333">${i+1}m ago</td>
                </tr>
            `;
        }
        lTable.innerHTML = logHtml;

        function tab(t) {
            document.getElementById('users-sec').classList.toggle('hidden', t !== 'users');
            document.getElementById('purge-sec').classList.toggle('hidden', t !== 'purge');
            document.getElementById('logs-sec').classList.toggle('hidden', t !== 'logs');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
