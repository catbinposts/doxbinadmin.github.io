<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Manager v2.0</title>
    <style>
        :root {
            --bg-main: #050505;
            --bg-sidebar: #020202;
            --bg-card: #0a0a0a;
            --border: #141414;
            --accent: #bb71e4; /* VIP/Light Purple */
            --criminal: #7a2eb0; /* Dark Purple */
            --rich: #ffd700; /* Gold */
            --text: #888;
            --danger: #ff4444;
            --success: #00ff88;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }

        /* --- UI Framework --- */
        .navbar {
            height: 60px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: fixed;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
        }

        .brand { color: #fff; font-weight: bold; letter-spacing: 2px; }
        .brand span { color: var(--accent); }

        .layout { display: flex; padding-top: 60px; }

        .sidebar {
            width: 240px;
            height: calc(100vh - 60px);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            padding-top: 20px;
        }

        .nav-item {
            padding: 15px 30px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 2px solid transparent;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .nav-item:hover { background: #080808; color: #fff; }
        .nav-item.active { 
            background: #0d0d0d; 
            color: #fff; 
            border-left-color: var(--accent);
        }

        .main { margin-left: 240px; padding: 40px; width: calc(100% - 240px); box-sizing: border-box; }

        /* --- Components --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        input, select {
            background: #000;
            border: 1px solid var(--border);
            padding: 12px;
            color: #fff;
            font-family: inherit;
            margin-bottom: 10px;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-size: 11px;
            transition: 0.3s;
        }

        .btn:hover { background: #fff; color: #000; }
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .btn-success { border-color: var(--success); color: var(--success); }
        .btn-success:hover { background: var(--success); color: #000; }

        /* --- Ranks & UI Polish --- */
        .rank { font-weight: bold; padding: 2px 6px; border-radius: 2px; font-size: 10px; }
        .rank-vip { color: var(--accent); border: 1px solid var(--accent); }
        .rank-criminal { color: var(--criminal); border: 1px solid var(--criminal); }
        .rank-rich { color: var(--rich); border: 1px solid var(--rich); text-shadow: 0 0 5px var(--rich); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid var(--border); color: #444; font-size: 10px; }
        td { padding: 12px 15px; border-bottom: 1px solid var(--border); }

        .hidden { display: none; }
        .console-text { color: var(--success); font-family: monospace; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">SYSTEM<span>CORE</span></div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="nav-item active" onclick="tab('home')">Home</div>
            <div class="nav-item" onclick="tab('users')">Users</div>
            <div class="nav-item" onclick="tab('management')">User Control</div>
            <div class="nav-item" onclick="tab('purge')">Purge System</div>
            <div class="nav-item" onclick="tab('logs')">Audit Logs</div>
        </aside>

        <main class="main">
            <!-- HOME / SERVER FUNCTIONS -->
            <div id="home-sec">
                <h2 style="color:#fff">System Status</h2>
                <div class="grid-3">
                    <div class="card">
                        <h4 style="margin:0">Database Cluster</h4>
                        <p class="console-text">ONLINE [0.4ms]</p>
                        <button class="btn btn-danger" onclick="serverOp('STOP_DB')">Kill DB</button>
                    </div>
                    <div class="card">
                        <h4 style="margin:0">Main Server</h4>
                        <p class="console-text" id="serverStatus">RUNNING</p>
                        <button class="btn btn-danger" onclick="serverOp('STOP_SRV')">Stop Server</button>
                        <button class="btn btn-success" onclick="serverOp('START_SRV')">Restart</button>
                    </div>
                    <div class="card">
                        <h4 style="margin:0">Firewall</h4>
                        <p class="console-text">ACTIVE [DROP_ALL]</p>
                        <button class="btn">Settings</button>
                    </div>
                </div>
            </div>

            <!-- USERS LIST -->
            <div id="users-sec" class="hidden">
                <div class="card">
                    <table>
                        <thead>
                            <tr><th>ID</th><th>User</th><th>Rank</th><th>Joined</th></tr>
                        </thead>
                        <tbody id="userTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- USER CONTROL PANEL -->
            <div id="management-sec" class="hidden">
                <div class="card" style="max-width: 500px;">
                    <h3>User Override Panel</h3>
                    <p>Enter exact username to modify permissions.</p>
                    <input type="text" id="targetUser" placeholder="Username..." style="width:100%">
                    <div style="display:flex; gap:10px; margin-bottom: 20px;">
                        <select id="rankSelect" style="flex:1">
                            <option value="vip">VIP [$30]</option>
                            <option value="criminal">Criminal [$50]</option>
                            <option value="rich">Rich [$100]</option>
                        </select>
                        <button class="btn btn-success" onclick="modifyUser('RANK')">Set Rank</button>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <button class="btn btn-danger" onclick="modifyUser('BAN')">Permanent Ban</button>
                        <button class="btn" onclick="modifyUser('KICK')">Session Kick</button>
                    </div>
                    <div id="mgtStatus" class="console-text" style="margin-top:20px; display:none;"></div>
                </div>
            </div>

            <!-- PURGE SECTION -->
            <div id="purge-sec" class="hidden">
                <div class="card">
                    <h3>Paste Nullifier</h3>
                    <input type="text" id="purgeInput" placeholder="Paste URL..." style="width: 100%">
                    <button class="btn btn-danger" style="width:100%" onclick="executePurge()">Wipe from Storage</button>
                </div>
            </div>

            <!-- LOGS -->
            <div id="logs-sec" class="hidden">
                <div class="card">
                    <table id="logTable"></table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const users = [
            {n: "asuna", r: "rich", j: "2023"}, {n: "Bella", r: "vip", j: "2024"}, 
            {n: "ceo", r: "rich", j: "2020"}, {n: "Hacker", r: "criminal", j: "2021"}
        ];

        // Fill user table
        function renderUsers() {
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = users.map((u, i) => `
                <tr>
                    <td>#${2000+i}</td>
                    <td style="color:#fff">${u.n}</td>
                    <td><span class="rank rank-${u.r}">${u.r.toUpperCase()}</span></td>
                    <td>${u.j}</td>
                </tr>
            `).join('');
        }

        // Server Ops
        function serverOp(op) {
            const s = document.getElementById('serverStatus');
            if(op === 'STOP_SRV') {
                s.innerText = "OFFLINE";
                s.style.color = "var(--danger)";
            } else if(op === 'START_SRV') {
                s.innerText = "REBOOTING...";
                setTimeout(() => { s.innerText = "RUNNING"; s.style.color = "var(--success)"; }, 2000);
            }
        }

        // User Management
        function modifyUser(type) {
            const user = document.getElementById('targetUser').value;
            const status = document.getElementById('mgtStatus');
            if(!user) return;

            status.style.display = "block";
            status.innerText = `[SYS] Executing ${type} on ${user}...`;
            
            setTimeout(() => {
                status.innerText = `[DONE] ${user} has been updated.`;
            }, 1000);
        }

        // Navigation
        function tab(t) {
            ['home', 'users', 'management', 'purge', 'logs'].forEach(s => {
                document.getElementById(s + '-sec').classList.add('hidden');
            });
            document.getElementById(t + '-sec').classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            if(t === 'users') renderUsers();
        }

        // Generate Logs
        const logData = [];
        const ops = ["Admin", "ceo", "Kaede"];
        const acts = ["SET_RANK", "BAN", "PURGE", "RESTART_SRV"];
        for(let i=0; i<50; i++) {
            logData.push(`<tr><td>${ops[i%3]}</td><td>${acts[i%4]}</td><td>node_0${i}</td><td>${i}m ago</td></tr>`);
        }
        document.getElementById('logTable').innerHTML = logData.join('');

    </script>
</body>
</html>
