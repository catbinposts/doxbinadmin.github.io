<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>manager panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050505;
    --sidebar:#0a0a0a;
    --card:#101010;
    --border:#1d1d1d;

    --text:#e0e0e0;
    --muted:#7a7a7a;

    --purple:#b76cff;
    --purple2:#6b42ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    overflow-x:hidden;
    background: linear-gradient(145deg,#040404,#0d0717,#050505);
}

/* LOGIN */

.login-screen{
    position:fixed;
    inset:0;
    z-index:999999;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(20px);
    background:rgba(0,0,0,.75);
}

.login-box{
    width:420px;
    background:rgba(10,10,10,.95);
    border:1px solid rgba(255,255,255,.06);
    border-radius:24px;
    padding:35px;
}

.login-title{font-size:34px;font-weight:900;}
.login-sub{color:#8f8f8f;margin-bottom:24px;}
.login-error{margin-top:15px;color:#ff6a7d;display:none;}
.hidden{display:none!important;}

/* NAVBAR */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:68px;
    background:rgba(4,4,4,.8);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.05);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    z-index:999;
}

.brand{
    font-size:20px;
    font-weight:900;
}

.brand span{color:var(--purple);}

/* RIGHT LABEL */
.right-label{
    position:absolute;
    right:26px;
    top:22px;
    font-weight:800;
    font-size:13px;
    color:#cfcfcf;
}

/* LAYOUT */

.layout{
    display:flex;
    padding-top:68px;
}

.sidebar{
    width:250px;
    height:calc(100vh - 68px);
    background:rgba(8,8,8,.85);
    backdrop-filter:blur(12px);
    border-right:1px solid rgba(255,255,255,.04);
    position:fixed;
}

.nav-item{
    padding:15px 24px;
    color:#8d8d8d;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.nav-item:hover{background:#121212;color:white;}
.nav-item.active{background:#141414;border-left:3px solid var(--purple);color:white;}

/* MAIN */

.main{
    margin-left:250px;
    width:100%;
    padding:30px;
}

/* CARDS */

.card{
    background:rgba(20,20,20,.9);
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;
    padding:24px;
    margin-bottom:22px;
}

.card-title{
    color:#868686;
    font-size:11px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:18px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.stat{
    border-radius:18px;
    padding:22px;
    background:#151515;
    border:1px solid rgba(255,255,255,.05);
}

.stat-value{
    font-size:28px;
    font-weight:900;
}

.stat-label{
    margin-top:8px;
    color:#757575;
    font-size:12px;
}

/* BUTTONS */

.btn{
    background:#171717;
    border:1px solid #2b2b2b;
    color:#d2d2d2;
    padding:11px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.btn:hover{border-color:var(--purple);color:white;}

.btn-purple{
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    border:none;
    color:white;
}

.btn-danger{
    background:#211014;
    border-color:#4d1d27;
    color:#ff8ea1;
}

/* INPUTS */

input,select{
    width:100%;
    background:#0b0b0b;
    border:1px solid rgba(255,255,255,.06);
    color:white;
    padding:14px;
    border-radius:12px;
}

/* PANELS */

.panel{display:none;}
.panel.active{display:block;}

/* TABLE */

.table-wrap{
    border-radius:16px;
    overflow:auto;
    border:1px solid rgba(255,255,255,.05);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0b0b0b;
    padding:16px;
    text-align:left;
    font-size:11px;
    color:#707070;
}

td{
    padding:16px;
    border-bottom:1px solid rgba(255,255,255,.04);
}

/* STATUS */

.status-online{color:#4be285;}
.status-offline{color:#8d8d8d;}
.status-banned{color:#ff637d;}
.status-timeout{color:#ffbf52;}
.status-kicked{color:#9d9d9d;}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="login-title">secure access</div>
        <div class="login-sub">enter password</div>

        <input type="password" id="passwordInput" onkeydown="if(event.key==='Enter') login()">

        <button class="btn btn-purple" style="width:100%;margin-top:18px;" onclick="login()">unlock</button>

        <div class="login-error" id="loginError">invalid password</div>
    </div>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <div class="brand">control<span>.core</span></div>
    <div class="right-label">silent [Manager]</div>
</div>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="nav-item active" onclick="switchPanel('dashboard',this)">Dashboard</div>
    <div class="nav-item" onclick="switchPanel('users',this)">Users</div>
    <div class="nav-item" onclick="switchPanel('userpanel',this)">User Panel</div>
    <div class="nav-item" onclick="switchPanel('logs',this)">Audit Logs</div>

</aside>

<!-- MAIN -->
<main class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="panel active">

    <div class="stats">

        <div class="stat">
            <div class="stat-value" id="totalUsers">0</div>
            <div class="stat-label">TOTAL USERS</div>
        </div>

        <div class="stat">
            <div class="stat-value" id="onlineUsers">0</div>
            <div class="stat-label">ONLINE USERS</div>
        </div>

        <div class="stat">
            <div class="stat-value">SECURE</div>
            <div class="stat-label">NODE STATUS</div>
        </div>

    </div>

</div>

<!-- USERS -->
<div id="users" class="panel">

    <div class="card">

        <input id="searchInput" oninput="renderUsers()" placeholder="Search users...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Rank</th><th>Status</th><th>Joined</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>

    </div>

</div>

<!-- USER PANEL -->
<div id="userpanel" class="panel">

    <div class="card">

        <input id="targetUser" placeholder="username...">

        <select id="rankSelect">
            <option>MEMBER</option>
            <option>VIP</option>
            <option>CRIMINAL</option>
            <option>RICH</option>
            <option>COUNCIL</option>
            <option>MOD</option>
            <option>MANAGER</option>
            <option>ADMIN</option>
            <option>FOUNDER</option>
        </select>

        <button class="btn btn-purple" onclick="changeRank()">Change Rank</button>
        <button class="btn btn-danger" onclick="deleteUser()">Delete</button>

        <div id="panelStatus"></div>

    </div>

</div>

<!-- LOGS -->
<div id="logs" class="panel">
    <div id="logsBox"></div>
</div>

</main>
</div>

<script>

/* LOGIN */
function login(){
    const pass=document.getElementById("passwordInput").value;
    if(pass==="1344"){
        document.getElementById("loginScreen").classList.add("hidden");
    } else {
        document.getElementById("loginError").style.display="block";
    }
}

/* USERS */
const users=[];
const ranks=["MEMBER","VIP","CRIMINAL","RICH","COUNCIL","MOD","MANAGER","ADMIN","FOUNDER"];

for(let i=0;i<80;i++){
users.push({
id:Math.floor(Math.random()*99999),
name:"user"+i,
rank:"MEMBER",
status:Math.random()>0.5?"Online":"Offline",
joined:"2025"
});
}

/* RENDER */
function renderUsers(){
const t=document.getElementById("userTable");

t.innerHTML=users.map(u=>`
<tr>
<td>${u.id}</td>
<td>${u.name}</td>
<td>${u.rank}</td>
<td>${u.status}</td>
<td>${u.joined}</td>
</tr>`).join("");

document.getElementById("totalUsers").innerText=users.length;
document.getElementById("onlineUsers").innerText=users.filter(u=>u.status==="Online").length;
}

renderUsers();

/* PANEL SWITCH */
function switchPanel(id,el){
document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
document.getElementById(id).classList.add("active");
el.classList.add("active");
}

/* USER OPS */
function getUser(){
const n=document.getElementById("targetUser").value.toLowerCase();
return users.find(u=>u.name.toLowerCase()===n);
}

function changeRank(){
const u=getUser();
if(!u)return;
u.rank=document.getElementById("rankSelect").value;
renderUsers();
}

function deleteUser(){
const u=getUser();
if(!u)return;
users.splice(users.indexOf(u),1);
renderUsers();
}

</script>

</body>
</html>
