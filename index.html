body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:'Inter',sans-serif;
    color:white;

    background:
    linear-gradient(
        135deg,
        #05060b 0%,
        #0c1120 25%,
        #131a31 55%,
        #0b0f18 100%
    );

    background-attachment:fixed;
    background-repeat:no-repeat;
    background-size:cover;
}
