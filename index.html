<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowbin Admin - Dashboard</title>
    <style>
        /* Shared Base Styles */
        :root {
            --bg-main: #0e0e0e;
            --bg-sidebar: #0a0a0a;
            --bg-input: #1e1e1e;
            --border-color: #1c1c1c;
            --text-main: #ccc;
            --text-muted: #666;
            --accent-red: #cc1111;
            --success-green: #5cb85c;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
            font-size: 13px;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            position: fixed; top: 0; left: 0; right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            z-index: 9999;
        }

        .navbar a {
            color: #888;
            text-decoration: none;
            padding: 0 10px;
            line-height: 40px;
        }

        .navbar .brand {
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .navbar .user-badge {
            margin-left: auto;
            background: #1a0000;
            border: 1px solid #660000;
            padding: 2px 9px;
            color: #ff0000; /* Admin color default */
            font-weight: bold;
        }

        /* Layout */
        .layout {
            display: flex;
            padding-top: 40px;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 170px;
            background: var(--bg-sidebar);
            border-right: 1px solid #191919;
            padding-top: 16px;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 0 14px 10px;
            font-size: 11px;
            font-weight: bold;
            color: #eee;
            text-transform: uppercase;
            border-bottom: 1px solid #191919;
            margin-bottom: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            gap: 7px;
        }

        .nav-item.active {
            background: #161616;
            color: #fff;
        }

        .nav-item.active .icon { color: var(--accent-red); }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 24px 30px;
            min-width: 0;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }

        th {
            padding: 6px 10px;
            background: #111;
            color: #777;
            text-align: left;
            border-bottom: 1px solid #222;
            font-weight: normal;
            font-size: 12px;
        }

        td {
            padding: 6px 10px;
            border-bottom: 1px solid #1c1c1c;
            font-size: 12px;
            color: #aaa;
        }

        /* Forms & Inputs */
        .field-input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-input);
            border: 1px solid #2c2c2c;
            color: #ccc;
            padding: 5px 8px;
            font-size: 13px;
            outline: none;
            margin-bottom: 8px;
        }

        .update-btn {
            background: #1a3a1a;
            color: var(--success-green);
            border: 1px solid #3a6b3a;
            padding: 4px 14px;
            cursor: pointer;
        }

        .hidden { display: none; }

        .role-founder { color: rgb(255,187,0); font-weight: bold; }
        .role-admin { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand">Meowbin</a>
        <a href="#">Home</a>
        <a href="#">Add Paste</a>
        <a href="#">Users</a>
        <a href="#" style="color: #ddd;">Admin</a>
        <div class="user-badge" id="userDisplay">ADMIN [Admin]</div>
    </nav>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">Admin</div>
            <button class="nav-item active" onclick="showSection('announcements')">
                <span class="icon">⌂</span> Home
            </button>
            <button class="nav-item" onclick="showSection('users')">
                <span class="icon">♙</span> Users
            </button>
            <button class="nav-item" onclick="showSection('blacklist')">
                <span class="icon">⊘</span> Blacklist
            </button>
            <button class="nav-item" onclick="showSection('logs')">
                <span class="icon">☰</span> Logs
            </button>
        </aside>

        <main class="main-content">
            
            <section id="announcements">
                <h2 style="font-size: 16px; font-weight: normal; margin-top: 0;">Announcements</h2>
                <div style="background: #141414; border: 1px solid #232323; padding: 15px;">
                    <label style="font-size: 11px; color: #666;">Announcement Text</label>
                    <input type="text" class="field-input" id="annText" placeholder="Co nowego?">
                    <label style="font-size: 11px; color: #666;">Link</label>
                    <input type="text" class="field-input" id="annLink" placeholder="https://...">
                    <button class="update-btn" onclick="saveAnnouncement()">UPDATE</button>
                    <span id="saveMsg" style="font-size: 11px; margin-left: 10px;"></span>
                </div>
            </section>

            <section id="users" class="hidden">
                <h2 style="font-size: 16px; font-weight: normal; margin-top: 0;">Users</h2>
                <div style="display: flex; gap: 6px; margin-bottom: 14px;">
                    <input type="text" class="field-input" style="width: 240px; margin-bottom: 0;" placeholder="Search username...">
                    <button class="field-input" style="width: auto; cursor: pointer;">Search</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>IP</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr>
                            <td>1</td>
                            <td class="role-admin">Admin</td>
                            <td class="role-admin">admin</td>
                            <td>127.0.0.1</td>
                            <td><button class="update-btn" style="font-size: 10px;">Set Role</button></td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section id="logs" class="hidden">
                <h2 style="font-size: 16px; font-weight: normal; margin-top: 0;">Admin Logs</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Admin</th>
                            <th>Action</th>
                            <th>Target</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td>Admin</td>
                            <td style="color: #f0ad4e; font-family: monospace;">LOGIN</td>
                            <td>System</td>
                            <td>2024-05-20 14:00</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>

    <script>
        // Logika przełączania sekcji (zastępuje routing Reacta)
        function showSection(sectionId) {
            // Ukryj wszystkie sekcje
            document.querySelectorAll('main section').forEach(section => {
                section.classList.add('hidden');
            });
            // Pokaż wybraną
            document.getElementById(sectionId).classList.remove('hidden');

            // Aktualizuj styl przycisków w sidebarze
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(sectionId)) {
                    btn.classList.add('active');
                }
            });
        }

        // Symulacja zapisu (zastępuje fetch API)
        function saveAnnouncement() {
            const btn = document.querySelector('#announcements .update-btn');
            const msg = document.getElementById('saveMsg');
            const text = document.getElementById('annText').value;

            btn.innerText = "SAVING...";
            btn.disabled = true;

            // Udajemy zapytanie do serwera
            setTimeout(() => {
                btn.innerText = "UPDATE";
                btn.disabled = false;
                msg.innerText = "Saved successfully!";
                msg.style.color = "#5cb85c";
                
                setTimeout(() => { msg.innerText = ""; }, 2500);
            }, 1000);
        }

        // Tutaj możesz dodać prawdziwe fetche jeśli wrzucisz to na serwer:
        /*
        async function loadUsers() {
            const r = await fetch('/api/admin/users');
            const d = await r.json();
            // render table body...
        }
        */
    </script>
</body>
</html>
