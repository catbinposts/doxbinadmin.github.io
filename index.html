<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>manager panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#070707;
 --sidebar:#0b0b0b;
 --card:#101010;
 --border:#1d1d1d;
 --text:#d8d8d8;
 --muted:#666;
 --purple:#bb71e4;
 --purple2:#8b4eff;
 --danger:#ff4d5a;
 --success:#42d67d;
 --warning:#ffb84d;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 background:var(--bg);
 color:var(--text);
 font-family:'Inter',sans-serif;
}

/* NAVBAR */
.navbar{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:60px;
 background:#050505;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 24px;
 z-index:999;
}

.brand{
 font-size:15px;
 font-weight:800;
 color:white;
}

.brand span{
 color:var(--purple);
}

.profile{
 display:flex;
 align-items:center;
 gap:12px;
}

.avatar{
 width:36px;
 height:36px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--purple),var(--purple2));
 box-shadow:0 0 20px rgba(187,113,228,.45);
}

/* LAYOUT */
.layout{
 display:flex;
 padding-top:60px;
}

.sidebar{
 width:240px;
 height:calc(100vh - 60px);
 background:#0b0b0b;
 border-right:1px solid var(--border);
 position:fixed;
}

.sidebar-inner{
 padding-top:20px;
}

.nav-item{
 padding:14px 24px;
 color:#777;
 cursor:pointer;
 transition:.2s;
 border-left:3px solid transparent;
 font-size:13px;
 font-weight:600;
}

.nav-item:hover{
 background:#111;
 color:white;
}

.nav-item.active{
 background:#101010;
 color:white;
 border-left-color:var(--purple);
}

/* MAIN */
.main{
 margin-left:240px;
 width:100%;
 padding:30px;
}

/* CARDS */
.card{
 background:linear-gradient(180deg,#101010,#0b0b0b);
 border:1px solid var(--border);
 border-radius:12px;
 padding:24px;
 margin-bottom:20px;
}

.card-title{
 color:#666;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 margin-bottom:16px;
}

/* STATS */
.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:18px;
 margin-bottom:24px;
}

.stat{
 background:#0d0d0d;
 border:1px solid var(--border);
 border-radius:12px;
 padding:18px;
}

.stat-value{
 font-size:26px;
 font-weight:800;
 color:white;
}

.stat-label{
 margin-top:5px;
 color:#666;
 font-size:12px;
}

/* BUTTONS */
.btn{
 background:#171717;
 border:1px solid #2b2b2b;
 color:#ccc;
 padding:10px 14px;
 border-radius:6px;
 cursor:pointer;
 transition:.2s;
 font-size:11px;
 font-weight:700;
 text-transform:uppercase;
}

.btn:hover{
 border-color:var(--purple);
 color:white;
}

.btn-danger{
 background:#1a1010;
 border-color:#3a1f1f;
 color:#ff9191;
}

.btn-purple{
 background:linear-gradient(135deg,var(--purple),var(--purple2));
 border:none;
 color:white;
}

/* TABLE */
.table-wrap{
 background:#0c0c0c;
 border:1px solid var(--border);
 border-radius:12px;
 overflow:auto;
 max-height:700px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th{
 text-align:left;
 padding:16px;
 color:#555;
 font-size:11px;
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 background:#0c0c0c;
}

td{
 padding:16px;
 border-bottom:1px solid #151515;
}

tr:hover{
 background:#111;
}

/* INPUTS */
input,select{
 width:100%;
 background:#080808;
 border:1px solid var(--border);
 color:white;
 padding:13px;
 border-radius:8px;
 outline:none;
}

input:focus, select:focus{
 border-color:var(--purple);
}

.panel-grid{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:20px;
}

/* PANELS */
.panel{ display:none; }
.panel.active{ display:block; }
</style>
</head>

<!-- PASSWORD GATE -->
<script>
const pass = prompt("Enter password:");
if(pass !== "1344"){
 document.documentElement.innerHTML = "<h1 style='color:white;background:black;padding:40px;font-family:sans-serif'>Access denied</h1>";
 throw new Error("Blocked");
}
</script>

<body>

<div class="navbar">
 <div class="brand">Manager <span>[Panel]</span></div>

 <div class="profile">
  <div>
   <div style="font-weight:700;">Manager</div>
   <div style="font-size:11px;color:#666;">Administrator</div>
  </div>
  <div class="avatar"></div>
 </div>
</div>

<div class="layout">

<aside class="sidebar">
 <div class="sidebar-inner">
  <div class="nav-item active" onclick="switchPanel('dashboard',this)">Dashboard</div>
  <div class="nav-item" onclick="switchPanel('users',this)">Users</div>
  <div class="nav-item" onclick="switchPanel('adduser',this)">Add User</div>
  <div class="nav-item" onclick="switchPanel('userpanel',this)">User Panel</div>
  <div class="nav-item" onclick="switchPanel('purge',this)">Post Purge</div>
  <div class="nav-item" onclick="switchPanel('logs',this)">Audit Logs</div>
 </div>
</aside>

<main class="main">

<!-- DASHBOARD -->
<div id="dashboard" class="panel active">
 <div class="stats">
  <div class="stat">
   <div class="stat-value" id="totalUsers">0</div>
   <div class="stat-label">TOTAL USERS</div>
  </div>
 </div>
</div>

</main>
</div>

<script>
function switchPanel(id,el){
 document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
 document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 el.classList.add("active");
}
</script>

</body>
</html>
