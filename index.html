<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Manager</title>
    <style>
        :root {
            --bg-main: #080808;
            --bg-sidebar: #030303;
            --bg-card: #0d0d0d;
            --border: #1a1a1a;
            --accent: #bb71e4;
            --text: #a0a0a0;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
        }

        .navbar {
            height: 50px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: fixed;
            width: 100%;
            z-index: 100;
            box-sizing: border-box;
        }

        .brand { color: #fff; font-weight: 800; letter-spacing: 1px; font-size: 14px; }
        .brand span { color: var(--accent); }

        .user-badge {
            margin-left: auto;
            border: 1px solid #3d1f4d;
            background: #150b1a;
            color: var(--accent);
            padding: 4px 12px;
            font-weight: bold;
            border-radius: 2px;
        }

        .layout { display: flex; padding-top: 50px; }

        .sidebar {
            width: 220px;
            height: calc(100vh - 50px);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            padding-top: 20px;
        }

        .nav-item {
            padding: 12px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover { background: #0a0a0a; color: #fff; }
        .nav-item.active { 
            background: #0f0f0f; 
            color: #fff; 
            border-left-color: var(--accent);
        }

        .main { margin-left: 220px; padding: 30px; width: 100%; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }

        .stat-card h4 { margin: 0 0 10px 0; color: #555; font-size: 10px; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 22px; color: #fff; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); }
        th { text-align: left; padding: 12px 15px; color: #444; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; }
        td { padding: 10px 15px; border-bottom: 1px solid #111; }
        tr:hover td { background: #111; color: #eee; }

        .role { font-weight: bold; font-size: 10px; }
        .role-manager { color: var(--accent); }
        .role-rich { color: #00ffcc; }
        .role-mod { color: #00d4ff; }
        .role-admin { color: #ff4444; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">SILENT <span>[MANAGER]</span></div>
        <div class="user-badge">ADMIN AUTHENTICATED</div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="nav-item active" onclick="tab('users')">👥 Users</div>
            <div class="nav-item" onclick="tab('logs')">📜 Audit Logs</div>
        </aside>

        <main class="main">
            <div id="users-sec">
                <div class="stats-grid">
                    <div class="stat-card"><h4>Total Members</h4><p>412</p></div>
                    <div class="stat-card"><h4>Online Now</h4><p>84</p></div>
                    <div class="stat-card"><h4>Active Pastes</h4><p>12,492</p></div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Rank</th>
                            <th>Stats</th>
                            <th>Joined</th>
                        </tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>

            <div id="logs-sec" class="hidden">
                <h2 style="color:#fff; margin-bottom: 20px;">System Activity</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Operator</th>
                            <th>Action</th>
                            <th>Context</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>

            {id: 7819, n: "ceo", r: "Manager", s: "0/27", j: "Jun 24, 2020"},
            {id: 15, n: "compression", r: "Mod", s: "0/5", j: "Apr 14, 2019"},
            {id: 6767, n: "Kaede", r: "Mod", s: "0/1", j: "Jun 4, 2020"},
            {id: 5530, n: "boss", r: "Council", s: "0/23", j: "May 7, 2020"},
            {id: 290795, n: "hell", r: "Council", s: "8/133", j: "Dec 26, 2022"}
        ];

        const list = ["asuna", "Bella", "go5", "her", "sewer", "ace", "mishka", "Hacker", "ye", "vxu", "xan", "king", "Kris", "Akanori", "baki", "laskun", "engineowning", "vayne", "paranoid", "law", "obsessor", "config", "Joey", "Worsaken", "ruin", "Ry", "Fed", "babytron", "tragic", "rockstar", "glow", "Ty", "proxy", "Kira", "bladee", "declare", "Leonardo", "sean", "ghoul", "lord", "kills", "Ivan", "femboy", "solar", "Dolphin", "Harmless", "Graveyard", "Vile", "horrid", "meow", "lyoni", "dw", "coffin", "Machiavelli", "Drayco", "Jay", "stalker", "doppler", "Icmp", "Water", "Rogue", "sick", "ave", "sin", "wdr", "DGSI", "mature", "father", "Kaito", "shorty", "Network", "Amulet", "Valor", "irc", "Cliqued", "Designer", "Konti", "crown", "compa", "zui", "cult", "cell", "viceatone", "Icarus", "bane", "cure", "Unknown", "Imran", "Lota", "Unholy", "drayn", "dinner", "sixset", "extort", "Eevee", "dritan", "kitty", "cherry", "crook", "skydive", "fiji", "xf24", "pastin", "vela", "xpath", "shawty", "Wilson", "Crew", "livid", "Ringwraith", "archive", "emma", "r00tkit", "injured", "fbh", "LOVEBRO", "eth", "candle", "agentone", "Larceny", "pvtswat", "Nocif", "Clairvoyant", "Ichigo", "juvenile", "ninja", "evelyn", "graceful", "Haine", "Priority", "templates", "prince", "Stitch", "strawb", "gia", "Rapture", "starboy", "ruhydon", "DexCFW", "Disturbia", "deathnotes", "Fusi", "ib", "Fire", "shokoloko", "Weather", "adderall", "lucki", "Christian", "Niridya", "distress", "tea", "wink", "lethal", "remi", "twink", "BestBuy", "Amoere", "Padlock", "dyssomnia", "Harm", "alex", "nanachi", "Pusha", "convict", "johnnyzyns", "Arcturus", "Swattin", "asset", "mop", "harmed", "vampire", "Terminator", "zoeycat", "John", "Demon", "Clique", "Valhalla", "goth", "scare", "Italy", "pumpkin", "merc"];

        // Generate full list
        list.forEach((name, i) => {
            rawUsers.push({
                id: 100 + i,
                n: name,
                r: "Rich",
                s: `${Math.floor(Math.random()*5)}/${Math.floor(Math.random()*40)}`,
                j: "2019-2024"
            });
        });

        const uTable = document.getElementById('userTable');
        uTable.innerHTML = rawUsers.map(u => `
            <tr>
                <td>#${u.id}</td>
                <td style="color:#eee; font-weight:600">${u.n}</td>
                <td><span class="role role-${u.r.toLowerCase()}">${u.r}</span></td>
                <td>${u.s}</td>
                <td style="color:#444">${u.j}</td>
            </tr>
        `).join('');

        const lTable = document.getElementById('logTable');
        let logHtml = "";
        for(let i=0; i<200; i++) {
            logHtml += `
                <tr>
                    <td style="color:var(--accent)">Silent[Manager]</td>
                    <td><span style="background:#111; padding:2px 5px; border-radius:3px;">MOD_ACTION</span></td>
                    <td>Resolved Report #${1000+i}</td>
                    <td style="color:#333">Just now</td>
                </tr>
            `;
        }
        lTable.innerHTML = logHtml;

        function tab(t) {
            document.getElementById('users-sec').classList.toggle('hidden', t !== 'users');
            document.getElementById('logs-sec').classList.toggle('hidden', t !== 'logs');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
